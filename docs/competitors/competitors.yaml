  verified: 2026-09-04
  version: "2.06 (Aug 2026; launched Apr 2026)"
  rating: "4.7 (20)"
  price: "Free (±3 h window) + Pro $2.99/mo, Unlimited $4.99/mo or $39.99/yr"
  tides: "No (currents-first)"
  currents: "Animated particle flow on ENC charts; NOAA model + PORTS; CHS station points since 2.04"
  offline: "None stated; streaming model"
  platforms: "iPhone"
  strengths:
