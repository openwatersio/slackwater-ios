# Single source of truth for comparison pages. US App Store, verified 2026-09-04.
# Update here first; pages quote these numbers.

slackwater:
  name: Slackwater
  version: "1.9.0 (TestFlight public beta, iOS 26+)"
  price: "Free core. Optional paid add-on (lock screen widgets) funds development."
  # Do not print our prices on slackwater.xyz (public repo rule).
  internal_price_note: "Premium $5.99/yr or $24.99 lifetime per Slackwater.storekit; not on the public site."
  tides: "Worldwide"
  currents: "US and Canada. Slack time and duration, max flood/ebb speed and set, reference-port tide on the same screen."
  offline: "Predictions computed on device. Chart (shoreline, depths, seamarks) downloads and draws offline."
  data: "NOAA harmonic constituents bundled (2,200+ stations). Canadian stations fitted on device from CHS published predictions; a few CHS gates are online-only and say so."
  validation: "Engine checked against NOAA/CHS published predictions; deviations printed on slackwater.xyz."
  widgets: "Home screen widgets free. Lock screen widgets paid."
  watch: false
  alerts: false
  live_activities: false
  weather: false
  ads: false
  account: false
  tracking: "None. No analytics SDK, no account."
  open_source: "GPL app on the MIT slackwater-engine; station data open."
  disclaimer: "Not for navigation."
  honest_gaps:
    - No Apple Watch app
    - No tide or slack alerts
    - No weather, wind or swell
    - Beta, iOS 26 only, small user base, no long track record
    - Canadian currents: 23 gates, some online-only

tide-guide:
  name: "Tide Guide: Charts & Tables"
  maker: Condor Digital LLC (Tucker MacDonald)
  url: https://apps.apple.com/us/app/tide-guide-charts-tables/id1406371071
  verified: 2026-09-04
  version: "7.3.12 (Jul 2026)"
  rating: "4.7 (9.8K)"
  size: "320 MB"
  price: "Free + Pro: $3.99–4.99/mo, $19.99–29.99/yr, $49.99 one-time, $150 lifetime"
  paywalled: "Widgets, complications, detailed charts, extended tables"
  tides: "Worldwide, via unnamed data providers"
  currents: "Current speed as one value in a data box; no current stations, no slack times"
  offline: "Partial. Tables cached; conditions need a connection"
  platforms: "iPhone, iPad, Mac, Watch, Vision Pro"
  strengths:
    - Apple Design Award; the best-looking tide app on the platform
    - Full Watch app, complications, scheduled Live Activities
    - 12+ marine weather conditions inline with the tide
    - 15 languages, strong accessibility
  weaknesses:
    - Currents are one buried number
    - Non-US accuracy complaints (UK datums, double highs)
    - Data provenance not named
    - Widgets cost a subscription; 320 MB; always-on location warning
  best_for: "Beach, surf and coastal weather at a glance on a Watch"
  not_for: "Transiting a pass; anyone who needs slack time"

ayetides:
  name: AyeTides XL
  maker: Hahn Software
  url: https://apps.apple.com/us/app/ayetides-xl/id383466582
  verified: 2026-09-04
  version: "3.2.12 (Jun 2026)"
  rating: "4.8 (1.3K XL edition; 4.8 (4.9K) iPhone edition, id 287316432)"
  size: "83 MB"
  price: "$7.99 one-time, no IAP, no ads"
  tides: "12,500+ locations worldwide (tides and/or currents)"
  currents: "Real harmonic current stations; sparse and sometimes mislocated in BC per paddler reports"
  offline: "Fully offline predictions (XTide lineage); map and sharing need network"
  platforms: "iPhone, iPad, Watch, widgets; iNavX/SEAiq integration"
  strengths:
    - One price since ~2010; the app boaters keep
    - Genuinely offline, genuinely has currents
    - Huge station list; used by professional pilots
  weaknesses:
    - Dated interface
    - No slack window or duration; you read the table
    - BC current stations thin and occasionally on land
    - Proprietary; no provenance or update date per station; much of the non-US corpus appears to descend from pre-2001 IHO tabulations (coordinate-precision analysis of the bundled database; stated on the vs page as "appears to")
  best_for: "Current stations outside the US and Canada, in one purchase; anyone who trusts the XTide tables"
  not_for: "Canadian passes; anyone who wants the slack answer without reading a table"

tides-near-me:
  name: Tides Near Me
  url: https://apps.apple.com/us/app/tides-near-me/id585223877
  verified: 2026-09-04
  version: "3.13.1 (Jul 2026)"
  rating: "4.8 (161K)"
  price: "Free with ads; Premium $1.99 and $14.99 (removes ads, 30-day forecasts, premium widgets)"
  tides: "Worldwide"
  currents: "Direction and timing at stations; premium widgets for currents"
  offline: "Nothing stated; works from a cache once loaded"
  platforms: "iPhone, iPad; Watch app for subscribers (standalone since 3.13.1, Jul 2026)"
  strengths:
    - The instant answer: open, nearest station, rising or falling
    - Largest user base of any tide app
    - Watch and widgets
  weaknesses:
    - Ads in the free tier
    - Needs a connection; no offline claim
    - Currents are timing only, no speed curve or slack window
  best_for: "Is it coming in or going out, right now, on a beach with signal"
  not_for: "Offline use; currents; anyone tired of ads"

tide-alert:
  name: "Tide Alert (NOAA) - Tide Chart"
  url: https://apps.apple.com/us/app/tide-alert-noaa-tide-chart/id1352211125
  verified: 2026-09-04
  version: "3.4.1 (Aug 2026)"
  rating: "4.8 (44K)"
  price: "Free + $6.99/3 mo, $19.99/yr, Gold $99.99 lifetime"
  tides: "US; expanded to Canada, Mexico and Latin America"
  currents: "Current speed overlaid on the tide chart with estimated slack begin/end"
  offline: "Favourite stations and month tables offline"
  platforms: "iPhone, iPad, Watch, Siri, home + lock widgets"
  strengths:
    - Alerts at a chosen tide level or time; the namesake feature
    - Full Watch app and Siri
    - Actively updated; Canada now covered
  weaknesses:
    - Slack is an estimated annotation on a tide chart, not a current station prediction
    - Full access is a subscription; lifetime is $99.99
    - Currents shown relative to a tide chart, not their own curve with set
  best_for: "Anyone who wants the phone to tell them when the tide hits a level"
  not_for: "Reading a pass; offline-first use beyond favourites"

actual-currents:
