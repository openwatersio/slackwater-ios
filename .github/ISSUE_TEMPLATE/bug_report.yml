name: Bug report
description: Report a bug or a prediction that looks wrong
title: ""
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what Slackwater showed instead.
    validations:
      required: true

  - type: input
    id: station
    attributes:
      label: Station
      description: For prediction problems, include the station name.

  - type: input
    id: date-time
    attributes:
      label: Date and time
      description: For prediction problems, include the date, time and time zone.

  - type: textarea
    id: official-source
    attributes:
      label: Official prediction
      description: For prediction problems, include what NOAA, CHS or another official source showed.

  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: e.g. iPhone 17, iOS 26.0

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Add screenshots or other details that could help.
