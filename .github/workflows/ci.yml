name: CI
run-name: "${{ github.event_name == 'pull_request' && format('CI · PR #{0}', github.event.number) || format('CI · {0}', github.sha) }}"

# Required checks is the protected-branch gate and accepts the app lane's docs-only skip.

on:
  pull_request:
  push:
    branches: [main]

env:
  # The Xcode the xcode-27 image carries. Both paths assert it: the hosted
  # build job fails if the image moves to another Xcode, and the studio job
  # fails unless the Studio's selected Xcode is this one, so both test
  # against the same SDK. Nightly archives on the same image (nightly.yml)
  # and does not check it. Change it with the image.
  CI_XCODE_VERSION: "27.1"

jobs:
  # Gates the app lane below. The lane is ~15 minutes of macOS runner time, and
  # public-repo macOS pools can queue at peak — a docs-only change should not
  # book one. Markdown-only PRs previously took a full run.
  #
  # This is a JOB-level gate, not `on: paths-ignore`, for two reasons: the free
  # Ubuntu lane below should still run, and a workflow that never starts leaves
  # a required check pending forever, whereas a job skipped by `if:` satisfies
  # it. The Required checks gate below absorbs that skipped job.
  #
  # Fail-safe by construction: only documentation and CLA signature changes skip the app lane.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    # This repo's default_workflow_permissions is `read`, which is GitHub's
    # RESTRICTIVE default — contents and packages only, no pull-requests scope.
    # Without this grant `gh api .../pulls/N/files` 403s, the step's fail-safe
    # fires, and the gate runs the Studio lane for every docs PR: silently
    # inert, exactly as if it were not here. Job-scoped so the other two jobs
    # keep the restrictive default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # No checkout on purpose. `git diff` would need the history, and a full
      # clone of this repo is 149 MB of committed pmtiles — a minute of runner
      # time on every PR to answer a question the API answers in a second.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # GitHub runs `run:` blocks as `bash -e {0}`, so ANY unhandled non-zero
          # aborts the step mid-decision — including `grep -v` finding nothing,
          # which is precisely the docs-only case this job exists to detect. That
          # is not hypothetical: it turned the first correct skip into a red build
          # on main. Every failure below is handled explicitly and falls through
          # to running the suite, so -e can only convert a right answer into a
          # broken one.
          set +e
          set -uo pipefail
          # Falling through to "run" is the safe direction, but it must never be
          # a SILENT one: a permanently broken gate that always runs the Studio
          # lane looks exactly like a green, working gate. Warn, visibly, and
          # still succeed.
          run_it() {
            echo "::warning title=Docs-only gate could not decide::$1"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = "pull_request" ]; then
            # --paginate: up to 3000 files, far past anything real here.
            FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') \
              || run_it "could not list PR files — running the app lane"
          else
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000)
                run_it "no usable base ref — running the app lane" ;;
            esac
            FILES=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') \
              || run_it "could not compare $BEFORE...$SHA — running the app lane"
            # The compare endpoint truncates at 300 files. A diff that large is
            # not docs-only, but do not rely on guessing what got cut.
            [ "$(echo "$FILES" | wc -l)" -ge 300 ] && run_it "diff truncated at 300 files — running the app lane"
          fi

          [ -z "$FILES" ] && run_it "no files reported — running the app lane"
          echo "changed:"; echo "$FILES" | sed 's/^/  /'

          # `|| true`: grep -v exits 1 when everything is filtered out, i.e. the
          # docs-only case. Belt and braces alongside `set +e` above.
          OTHER=$(echo "$FILES" | grep -vE '^docs/|^[^/]*\.md$|^\.cla\.json$' || true)
          if [ -n "$OTHER" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "-> app lane RUNS (non-docs paths present)"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "-> app lane SKIPPED (only documentation or CLA signatures changed)"
          fi

  # Picks the app lane's path: the Studio's self-hosted runners (studio job)
  # or the hosted build plus shards (build and app jobs). This is not the
  # guard. A pull request runs the workflow from its own head and can delete
  # this job; the runners' job-started hook enforces the same trust rule where
  # a pull request cannot edit it (scripts/ci-runner/hook-job-started.sh), and
  # kills a refused job before any step runs. A fork's edited workflow never
  # starts without a maintainer's click while the repository's "Require
  # approval for all outside collaborators" setting stays on.
  #
  # Trusted is a push to main, or a pull request opened by a person (author
  # type User) from a branch in this repository, which only people with push
  # access can create, other than a dependabot/ branch. Other bots' pull
  # requests go hosted too. Nobody wrote a Dependabot branch's bumped
  # packages, including when a person rebases or edits one, so they meet the
  # hosted path first. CI_STUDIO is the off switch for when
  # the Studio is away: set it to anything but `on` and the next run goes
  # hosted, instead of queueing for a runner that is not coming back.
  route:
    name: Route the app lane
    needs: changes
    runs-on: ubuntu-24.04
    outputs:
      trusted: ${{ steps.route.outputs.trusted }}
      studio: ${{ steps.route.outputs.studio }}
    steps:
      - id: route
        env:
          TRUSTED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && !startsWith(github.event.pull_request.head.ref, 'dependabot/')) }}
          CI_STUDIO: ${{ vars.CI_STUDIO }}
          APP_NEEDED: ${{ needs.changes.outputs.app }}
        run: |
          studio=false
          if [ "$APP_NEEDED" = true ] && [ "$CI_STUDIO" = on ] && [ "$TRUSTED" = true ]; then
            studio=true
          fi
          echo "trusted=$TRUSTED" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "app needed: $APP_NEEDED, CI_STUDIO: ${CI_STUDIO:-unset}, trusted: $TRUSTED -> studio: $studio"

  data:
    name: Data generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      - name: CI and release tooling
        run: |
          ruby scripts/test-shards.test.rb
          python3 scripts/nightly-validation.test.py
          python3 scripts/cancel-closed-ci.test.py
          ruby scripts/nightly-workflow.test.rb
          sudo apt-get update && sudo apt-get install -y zsh
          zsh scripts/nightly.test.sh
          zsh scripts/promote-nightly.test.sh
          ruby scripts/promote-workflow.test.rb
          node --test scripts/asc.test.mjs

      - name: Fixture tooling
        run: node --test scripts/iwls-fixtures.test.mjs scripts/appstore.test.mjs scripts/asc-appstore.test.mjs

      # Every generator reads local files only, which means CI can regenerate
      # them and prove the committed bundles still match — a generator edited
      # without a rerun fails here instead of shipping stale data to the App
      # Store.
      - name: Regenerate the bundles
        working-directory: tools
        run: npm run build:data

      - name: Committed bundles match their generators
        run: git diff --exit-code Slackwater/Resources/stations.json Slackwater/Resources/stations.tcdb Slackwater/Resources/currents.json Slackwater/Resources/currents.tcdb Slackwater/Resources/slugs.json Slackwater/Resources/station-index.json Slackwater/Resources/unavailable-stations.json Slackwater/Resources/chs-stations.json Slackwater/Resources/chs-tombstones.json Slackwater/Resources/station-tombstones.json Slackwater/Resources/station-successors.json Slackwater/Resources/chs-gates.json Slackwater/Resources/chs-current-gates.json

      - name: Bundle invariants
        working-directory: tools
        run: node --test

  feedback:
    name: TestFlight intake
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - run: npm ci --ignore-scripts
        working-directory: services/testflight-feedback
      - run: npm test
        working-directory: services/testflight-feedback
      - run: npm run check
        working-directory: services/testflight-feedback

  # A pull request can slip a package in through package-lock.json, which
  # reviewers rarely read. npm keeps existing resolved URLs when it regenerates,
  # so the diff alone misses a swapped tarball; lockfile-lint catches that.
  lockfile:
    name: Lockfile · ${{ matrix.dir }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        dir: [tools, services/testflight-feedback]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - name: Check the lockfile regenerates from package.json
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.0.1 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names

  # Builds once for every test shard below. The shards spent about half of
  # each job rebuilding the same app (a 521 s build behind ~500 s of tests),
  # and on a free org's five macOS slots that doubled the wall clock.
  build:
    name: Build for testing
    # Successful full build jobs: median 3.55 min, p90 6.55 min (100-run audit).
    timeout-minutes: 20
    needs: [changes, route]
    concurrency:
      group: ci-build-${{ github.event_name == 'push' && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The hosted path, for forks, bots, Dependabot branches, and whenever
    # CI_STUDIO is off. Skipping it here skips the shards too, since app needs
    # this job.
    if: needs.changes.outputs.app == 'true' && needs.route.outputs.studio != 'true'
    # The same image Nightly archives on (nightly.yml), so the suite runs
    # against the SDK the shipped build links. macos-latest defaults to Xcode
    # 26.6, whose SDK the iPhone Duo runs phone-sized (#918).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The studio job asserts the same version, so an image that moves to
      # another Xcode fails here instead of quietly testing a different SDK.
      - name: Check the Xcode version
        run: |
          actual=$(xcodebuild -version | head -1)
          [ "$actual" = "Xcode $CI_XCODE_VERSION" ] || {
            echo "::error::the xcode-27 image's Xcode is '$actual', not Xcode $CI_XCODE_VERSION; update CI_XCODE_VERSION with the image"
            exit 1
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml

      - run: brew install xcodegen

      - name: Test runner modes
        run: |
          zsh scripts/test-modes.test.sh
          sh scripts/test-retryable.test.sh
          sh scripts/test-failed-selectors.test.sh
          sh scripts/ci-runner/hook-job-started.test.sh
          zsh scripts/ci-runner/cleanup-slot.test.sh
          sh scripts/ci-runner/install.test.sh
          python3 scripts/localization.test.py

      - name: Build fitting validator
        run: swift build -c release --package-path tools/FitValidation

      # MapLibre is a binary download, not a compile — the cache saves the
      # fetch, not a build. The generated xcodeproj and its Package.resolved
      # are not committed, so key on project.yml, where the package pins live.
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # The IWLS fixture is compiled into the unit-test bundle, so it is staged
      # here, before the build, and the shards never need it.
      - name: Prepare project
        run: |
          node scripts/iwls-fixtures.mjs prepare
          xcodegen generate

      - name: Localization completeness
        run: python3 scripts/localization.py

      - name: Build
        timeout-minutes: 15
        run: |
          # `bash -e` without pipefail: the pipe into tail would report tail's
          # status, and a failed build would upload a partial archive.
          set -o pipefail
          xcodebuild build-for-testing -project Slackwater.xcodeproj -scheme Slackwater \
            -testPlan Slackwater -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
            | tail -40
          # The watch app compiles for the watch simulator as the app's
          # dependency and embeds in Debug. Its absence means it silently
          # stopped building, not that the app is fine.
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/Slackwater.app/Watch/SlackwaterWatch.app
          # tar, not a bare artifact upload: that drops the executable bits
          # and symlinks the app and the test runner need.
          tar -C build/DerivedData/Build -czf build/products.tgz Products

      - uses: actions/upload-artifact@v7
        with:
          name: build-products
          path: build/products.tgz
          retention-days: 7

  app:
    name: App tests · ${{ matrix.shard.name }}${{ matrix.device != 'iPhone 17' && ' · iPad' || '' }}
    needs: build
    concurrency:
      group: ci-app-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{ matrix.shard.name }}-${{ matrix.device }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: xcode-27  # same image as the build job, see there
    env:
      # The simulator runtime every step below boots and tests on; the
      # cold-boot comment below says why it is pinned, and to this one.
      SLACKWATER_SIM_OS: "27.0"
    # Balance lanes so a typical iPad test session stays under about 45 min:
    # setup before it takes about 10, and the rerun step below can add a few
    # tests' worth. The cap sits higher because hosted runners vary more than
    # the lanes do: the same five unchanged Settings tests took 6 to 12 min on
    # different runners, and one offline · iPad job took 57 min. A slow runner
    # plus a long rerun can still reach it. A runner that hangs inside
    # xcodebuild sits at GitHub's six-hour default otherwise: #550's list
    # shard was 67 min into a 10-minute step, holding a slot, until someone
    # cancelled it.
    timeout-minutes: 75
    # Six shards per device. The org has five macOS slots, so a PR's sixth
    # iPhone job waits for the first to finish, and a push to main's twelve
    # run in three waves. Premium got its own shard because it outgrew rest:
    # PremiumSheetTests took 18-24 min of an iPad rest lane that, with it,
    # reached 74 min and then the 75-min cap.
    #
    # Keep long UI classes spread across lanes: alert popups run with offline,
    # map search with list, accessibility audits and tours with detail, and
    # PremiumSheetTests alone in premium. Settings methods span four shards;
    # printable tables run in offline, list, and transition. Rest catches new
    # tests and runs the unit target. Re-measure lanes from test-summary
    # artifacts and classes from a failed lane's test-evidence bundle.
    strategy:
      # A failing shard must not cancel its siblings. The whole point is to see
      # every failure in one run rather than the first one and then wait again.
      fail-fast: false
      matrix:
        # Pull requests get the fast iPhone run. A push to main runs --full on
        # both devices instead: Nightly releases whatever main holds without
        # re-running the suite, so this is where the iPad leg reports.
        device: ${{ fromJSON(github.event_name == 'push' && '["iPhone 17", "iPad Pro 11-inch (M5)"]' || '["iPhone 17"]') }}
        shard:
          - name: offline
            only: SlackwaterUITests/OfflineCoverageTests,SlackwaterUITests/AlertLineUITests,SlackwaterUITests/SettingsLayoutTests/testHeightDefaultsUseRegionAndPreserveAnExplicitChoice,SlackwaterUITests/SettingsLayoutTests/testSettingsInSpanish,SlackwaterUITests/SettingsLayoutTests/testSettingsInDutch,SlackwaterUITests/SettingsLayoutTests/testSettingsInItalian,SlackwaterUITests/SettingsLayoutTests/testMacSettingsShowsDesktopWidgets,SlackwaterUITests/PrintableTablesUITests/testAFreeUserGetsThePremiumSheet,SlackwaterUITests/PrintableTablesUITests/testAnOnlineGateMonthSaysWhatIsCovered,SlackwaterUITests/PrintableTablesUITests/testAnOnlineGateWithNothingStoredHasNoRow
          - name: list
            only: SlackwaterUITests/ListAndFavoritesTests,SlackwaterUITests/DeepLinkUITests,SlackwaterUITests/MapSearchAndNavigationTests,SlackwaterUITests/SettingsLayoutTests/testSlackWindowPreviewChangesWithComfortCurrent,SlackwaterUITests/SettingsLayoutTests/testSettingsInJapanese,SlackwaterUITests/SettingsLayoutTests/testSettingsInNorwegian,SlackwaterUITests/SettingsLayoutTests/testSettingsInKorean,SlackwaterUITests/SettingsLayoutTests/testMacWidgetInstructionsInFrenchAndSpanish,SlackwaterUITests/PrintableTablesUITests/testPremiumOpensTheWeekAndMonthAndOffersPrintAndSave,SlackwaterUITests/PrintableTablesUITests/testTheDetailShareButtonStillSendsTheLink
          - name: transition
            only: SlackwaterUITests/OfflineTransitionTests,SlackwaterUITests/DetailAndScrubTests/testM1Walkthrough,SlackwaterUITests/DetailAndScrubTests/testM42ContinuousScrubAcrossMidnight,SlackwaterUITests/DetailAndScrubTests/testReportAProblemOffersItsThreeSubjects,SlackwaterUITests/DetailAndScrubTests/testM41DetailHeaderSunMoon,SlackwaterUITests/SettingsLayoutTests/testWidgetsAndAboutAreInSettings,SlackwaterUITests/SettingsLayoutTests/testSettingsInGerman,SlackwaterUITests/SettingsLayoutTests/testSettingsInDanish,SlackwaterUITests/SettingsLayoutTests/testSettingsInEuropeanPortuguese,SlackwaterUITests/SettingsLayoutTests/testTVSettingsOmitsWidgetInstructions,SlackwaterUITests/PrintableTablesUITests/testTheRowClosesTheCurrentAndDerivedGateSchedules
          - name: detail
            only: SlackwaterUITests/DetailAndScrubTests,SlackwaterUITests/AccessibilityAuditTests,SlackwaterUITests/TourUITests,SlackwaterUITests/SettingsLayoutTests/testSettingsInFrench,SlackwaterUITests/SettingsLayoutTests/testSettingsInPortuguese,SlackwaterUITests/SettingsLayoutTests/testSettingsInFinnish,SlackwaterUITests/SettingsLayoutTests/testSettingsInSwedish,SlackwaterUITests/SettingsLayoutTests/testPremiumSupporterSeesTheirStatusInTheFooterAndSheet,SlackwaterUITests/SettingsLayoutTests/testPremiumMessagesOpenTheSupportSheetAndReturnToTheirPage
            skip: SlackwaterUITests/DetailAndScrubTests/testM1Walkthrough,SlackwaterUITests/DetailAndScrubTests/testM42ContinuousScrubAcrossMidnight,SlackwaterUITests/DetailAndScrubTests/testReportAProblemOffersItsThreeSubjects,SlackwaterUITests/DetailAndScrubTests/testM41DetailHeaderSunMoon
          - name: premium
            only: SlackwaterUITests/PremiumSheetTests
          # The catch-all names no tests — it SKIPS the others. A class added
          # tomorrow therefore runs here, instead of running nowhere and
          # looking green. Never convert this one to `only`.
          - name: rest
            skip: SlackwaterUITests/PremiumSheetTests,SlackwaterUITests/AlertLineUITests,SlackwaterUITests/AccessibilityAuditTests,SlackwaterUITests/TourUITests,SlackwaterUITests/OfflineCoverageTests,SlackwaterUITests/ListAndFavoritesTests,SlackwaterUITests/DeepLinkUITests,SlackwaterUITests/MapSearchAndNavigationTests,SlackwaterUITests/OfflineTransitionTests,SlackwaterUITests/DetailAndScrubTests,SlackwaterUITests/SettingsLayoutTests/testHeightDefaultsUseRegionAndPreserveAnExplicitChoice,SlackwaterUITests/SettingsLayoutTests/testSettingsInSpanish,SlackwaterUITests/SettingsLayoutTests/testSettingsInDutch,SlackwaterUITests/SettingsLayoutTests/testSettingsInItalian,SlackwaterUITests/SettingsLayoutTests/testMacSettingsShowsDesktopWidgets,SlackwaterUITests/SettingsLayoutTests/testSlackWindowPreviewChangesWithComfortCurrent,SlackwaterUITests/SettingsLayoutTests/testSettingsInJapanese,SlackwaterUITests/SettingsLayoutTests/testSettingsInNorwegian,SlackwaterUITests/SettingsLayoutTests/testSettingsInKorean,SlackwaterUITests/SettingsLayoutTests/testMacWidgetInstructionsInFrenchAndSpanish,SlackwaterUITests/SettingsLayoutTests/testWidgetsAndAboutAreInSettings,SlackwaterUITests/SettingsLayoutTests/testSettingsInGerman,SlackwaterUITests/SettingsLayoutTests/testSettingsInDanish,SlackwaterUITests/SettingsLayoutTests/testSettingsInEuropeanPortuguese,SlackwaterUITests/SettingsLayoutTests/testTVSettingsOmitsWidgetInstructions,SlackwaterUITests/SettingsLayoutTests/testSettingsInFrench,SlackwaterUITests/SettingsLayoutTests/testSettingsInPortuguese,SlackwaterUITests/SettingsLayoutTests/testSettingsInFinnish,SlackwaterUITests/SettingsLayoutTests/testSettingsInSwedish,SlackwaterUITests/SettingsLayoutTests/testPremiumSupporterSeesTheirStatusInTheFooterAndSheet,SlackwaterUITests/PrintableTablesUITests/testAFreeUserGetsThePremiumSheet,SlackwaterUITests/PrintableTablesUITests/testAnOnlineGateMonthSaysWhatIsCovered,SlackwaterUITests/PrintableTablesUITests/testAnOnlineGateWithNothingStoredHasNoRow,SlackwaterUITests/PrintableTablesUITests/testPremiumOpensTheWeekAndMonthAndOffersPrintAndSave,SlackwaterUITests/PrintableTablesUITests/testTheDetailShareButtonStillSendsTheLink,SlackwaterUITests/PrintableTablesUITests/testTheRowClosesTheCurrentAndDerivedGateSchedules,SlackwaterUITests/SettingsLayoutTests/testPremiumMessagesOpenTheSupportSheetAndReturnToTheirPage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@v8
        with:
          name: build-products

      - run: |
          mkdir -p build/DerivedData/Build
          tar -C build/DerivedData/Build -xzf products.tgz

      # CoreSimulator comes up cold on a fresh runner, and `xcodebuild` does not
      # wake it: it reports an EMPTY device list — placeholder destinations
      # only — and exits 70 on "Unable to find a device matching iPhone 17".
      # Listing the devices first starts the service, and the run below then
      # finds them. actions/runner-images#13459 collects the same one-liner in
      # front of `-downloadPlatform`, which fails the same way for the same
      # reason.
      #
      # This reads like a version problem and is not one. Switching
      # DEVELOPER_DIR to another Xcode also turns the lane green, which is
      # what makes this worth writing down: it works only because switching
      # re-enumerates the devices, so it treats the symptom and leaves a
      # version to maintain forever.
      #
      # The runtime IS pinned, by SLACKWATER_SIM_OS. The image's Xcode 27.1
      # has no iOS 27.1 runtime for these devices (that runtime carries only
      # the iPhone Duo), so an unpinned destination takes the newest runtime
      # that has them: 27.2, a pre-release build. 27.0 is the GA runtime that
      # has both devices. The pin keeps the lanes off pre-release runtimes;
      # it is not a fix for the hosted iOS 27 simulators sometimes never
      # drawing the notification permission prompt, which showed on 27.0 too
      # (#920, #921) and which the alert sheet now tolerates by saving and
      # closing before it asks.
      #
      # Then boot the device the tests run on (SLACKWATER_NO_CLONE below), so
      # its first boot is paid here and not by the first test's launch. On a
      # cold clone that launch took 26–34 s, the app never went idle, and the
      # accessibility query timed out: a different first test in each iPad
      # lane failed that way, rerun included, on three pushes in a row.
      #
      # A booted device still left the app's first launch slow: 37–62 s to
      # ready against ~10 s for every later test. So launch the app once here,
      # with the suite's no-network flags, then uninstall it so the tests
      # start from an empty container as they did on a fresh clone.
      # -seedLocationAsk and -seedTour as `testArguments` passes them: this is
      # a first launch, which otherwise raises the real location prompt. The
      # prompt outlives the uninstall, and the first test to tap anything has
      # XCUITest answer "Don't Allow", leaving the device denied for the shard.
      # ponytail: fixed 45 s settle; poll for the app going idle if it proves short.
      - run: |
          udid=$(xcrun simctl list devices "iOS $SLACKWATER_SIM_OS" available | grep -F "$DEVICE (" | tail -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$udid" ] || { echo "no simulator named '$DEVICE' on iOS $SLACKWATER_SIM_OS" >&2; exit 1; }
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/DerivedData/Build/Products/Debug-iphonesimulator/Slackwater.app
          xcrun simctl launch "$udid" io.openwaters.slackwater -noCloudSync -chartPacksOff -currentFillOff -uiTestQuiet -networkKillSwitch \
            -seedLocationAsk -seedTour
          sleep 45
          xcrun simctl terminate "$udid" io.openwaters.slackwater || true
          xcrun simctl uninstall "$udid" io.openwaters.slackwater
        env:
          DEVICE: ${{ matrix.device }}

      # SLACKWATER_SIMS must name ONE device — it overrides the script's
      # fast/full device list outright.
      # SLACKWATER_WORKERS is a memory budget: a booted simulator clone costs
      # ~2.2 GB and hosted arm runners have ~7 GB RAM, so one worker. If the
      # image's default Xcode ever drifts from what the project needs, pin
      # DEVELOPER_DIR here and in the build job.
      # SLACKWATER_PERF_SCALE widens two things calibrated on the Mac Studio:
      # the unit tests' wall-clock budgets, and every wait in the UI target
      # (ScreenshotTestCase's `uiWaitScale`). The first hosted run measured
      # 1.9–2.5× slower; 4× absorbs pool variance while a real 2×+ regression
      # on top of that still trips. Without it on the waits, three runs of
      # identical code failed three different UI tests — see #331.
      # continue-on-error: the verdict is the "Test result" step below, after
      # the one bounded rerun that a service timeout earns.
      #
      # xcodebuild can list no simulators at all while the device's first boot
      # still loads the runner: exit 70, "Unable to find a device matching",
      # no test run. That one error gets a second try here.
      - id: tests
        continue-on-error: true
        run: |
          SLACKWATER_XCTESTRUN=$(echo build/DerivedData/Build/Products/*.xctestrun)
          export SLACKWATER_XCTESTRUN
          ./scripts/test.sh ${MODE:+"$MODE"} && exit 0
          grep -q 'Unable to find a device matching' build/results-*.log || exit 1
          echo "::warning::xcodebuild found no simulator; retrying once"
          ./scripts/test.sh ${MODE:+"$MODE"}
        env:
          MODE: ${{ github.event_name == 'push' && '--full' || '' }}
          SLACKWATER_SIMS: ${{ matrix.device }}
          SLACKWATER_WORKERS: 1
          SLACKWATER_NO_CLONE: 1
          TEST_RUNNER_SLACKWATER_PERF_SCALE: "4"
          SLACKWATER_ONLY: ${{ matrix.shard.only }}
          SLACKWATER_SKIP: ${{ matrix.shard.skip }}

      # test.sh pipes xcodebuild through tail, so the job log holds test
      # names and no assertion text. Print each failure's message here, and
      # into the step summary, so a red shard can be read without downloading
      # its 150 MB bundle. For a week every push to main was red on two
      # iPad-only assertions that read as more flake because nothing surfaced
      # their text.
      #
      # Assertion failures stay red; service and execution timeouts get one rerun.
      - name: Failure messages
        id: failures
        if: steps.tests.outcome == 'failure'
        run: |
          { echo '```'; scripts/test-failures.sh build/*.xcresult; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(for b in build/*.xcresult; do
            xcrun xcresulttool get test-results tests --path "$b" 2>/dev/null \
              | jq -r -f scripts/test-failed-selectors.jq
          done | paste -sd, -)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          # Exit 0 only when there is at least one message and every one of
          # them is a service or execution timeout.
          if scripts/test-failures.sh build/*.xcresult | sh scripts/test-retryable.sh; then
            echo "retryable_only=true" >> "$GITHUB_OUTPUT"
          fi

      # The first attempt's bundle is renamed, not replaced: it is the evidence
      # of what timed out, and test.sh removes a bundle at the path it writes.
      - name: Rerun tests that timed out
        id: rerun
        if: steps.tests.outcome == 'failure' && steps.failures.outputs.retryable_only == 'true'
        run: |
          for b in build/*.xcresult build/*.log build/*.summary.json; do
            [ -e "$b" ] || continue
            case "$b" in
              *.xcresult) mv "$b" "${b%.xcresult}-attempt1.xcresult" ;;
              *.log) mv "$b" "${b%.log}-attempt1.log" ;;
              *.summary.json) mv "$b" "${b%.summary.json}-attempt1.summary.json" ;;
            esac
          done
          SLACKWATER_XCTESTRUN=$(echo build/DerivedData/Build/Products/*.xctestrun) \
            ./scripts/test.sh ${{ github.event_name == 'push' && '--full' || '' }} \
            || { scripts/test-failures.sh build/*.xcresult | grep -v attempt1; exit 1; }
        env:
          SLACKWATER_SIMS: ${{ matrix.device }}
          SLACKWATER_WORKERS: 1
          SLACKWATER_NO_CLONE: 1
          TEST_RUNNER_SLACKWATER_PERF_SCALE: "4"
          SLACKWATER_ONLY: ${{ steps.failures.outputs.failed }}

      - name: Test result
        if: always()
        run: test "${{ steps.tests.outcome }}" = success || test "${{ steps.rerun.outcome }}" = success

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-summary-${{ matrix.shard.name }}${{ matrix.device != 'iPhone 17' && '-ipad' || '' }}
          path: build/*.summary.json
          if-no-files-found: ignore

      # There is no runner to ssh into, so the evidence has to travel.
      # always(): by this step "Test result" has already failed the job, and
      # a condition without a status function is gated on success — the first
      # run under this workflow lost its evidence that way (#552's list shard).
      # 'cancelled' is the outcome a step gets when the job hits
      # timeout-minutes, and that is the failure with nothing to read anywhere
      # else: test.sh pipes xcodebuild through tail, so a shard that hangs
      # writes a log naming no test at all, and "Failure messages" never runs.
      - name: Upload screenshots and results
        if: always() && (steps.tests.outcome == 'failure' || steps.tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ matrix.shard.name }}${{ matrix.device != 'iPhone 17' && '-ipad' || '' }}
          path: |
            /tmp/slackwater-shots
            build/*.xcresult
            build/results-*.log
          if-no-files-found: ignore

  # The Studio path: one job per device that builds for testing and runs the
  # tests on the same machine, so there is no artifact round trip. Each runner
  # is ephemeral and owns one slot, SLACKWATER_CI_SLOT from its .env, with a
  # fixed pair of simulators named for it.
  studio:
    name: App tests · ${{ matrix.device }} (Studio)
    needs: [changes, route]
    if: needs.route.outputs.studio == 'true'
    # The iPhone job shares the hosted build's group, so a PR push that
    # switches paths (CI_STUDIO flipped between pushes) still cancels the
    # earlier run's job on the other path. The iPad job runs only on pushes
    # to main, whose groups are per run anyway.
    concurrency:
      group: ci-build-${{ github.event_name == 'push' && github.run_id || github.ref }}${{ matrix.device == 'iPad' && '-ipad' || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: [self-hosted, macOS, studio]
    # One job runs a device's whole suite here, build included, where the
    # hosted path splits it six ways. A push to main is expected to finish in
    # about 65 min; the cap leaves room for a rerun and still stops a hung
    # xcodebuild holding a slot for GitHub's six-hour default.
    timeout-minutes: 90
    strategy:
      # One device failing must not cancel the other's results.
      fail-fast: false
      matrix:
        # Pull requests run the fast suite on the iPhone; a push to main runs
        # --full on both, as the hosted app job does and for the same reason.
        device: ${{ fromJSON(github.event_name == 'push' && '["iPhone", "iPad"]' || '["iPhone"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The hosted path runs on the xcode-27 image, and Nightly archives
      # there; the Studio uses whichever Xcode is selected on the machine.
      - name: Check the Xcode version
        run: |
          actual=$(xcodebuild -version | head -1)
          [ "$actual" = "Xcode $CI_XCODE_VERSION" ] || {
            echo "::error::the Studio's selected Xcode is '$actual', not Xcode $CI_XCODE_VERSION (see xcode-select -p)"
            exit 1
          }

      # A cancelled job or a killed runner can leave the slot's clones booted
      # and its devices dirty. Clean before, and again after under always().
      - name: Clean the slot
        run: zsh scripts/ci-runner/cleanup-slot.sh "$SLACKWATER_CI_SLOT"

      # Between jobs the Studio runs the copies install.sh placed in the
      # runner directory, and nothing re-syncs them. A copy that differs from
      # main's is stale, or was rewritten by an earlier job. A push to main
      # compares with its checkout; a pull request, which may edit the
      # scripts, compares with main's, which the runners should hold. The
      # hook's path in the runner's .env names that directory; with no path
      # there, the runner was not installed the way the README says.
      - name: Installed runner scripts match the checkout
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${ACTIONS_RUNNER_HOOK_JOB_STARTED:-}" ]; then
            echo "::error::ACTIONS_RUNNER_HOOK_JOB_STARTED is not set: this runner was not installed as scripts/ci-runner/README.md says. Run sh scripts/ci-runner/install.sh on the Studio"
            exit 1
          fi
          dir=$(dirname "$ACTIONS_RUNNER_HOOK_JOB_STARTED")
          if [ "$EVENT" != push ]; then git fetch --depth 1 origin main; fi
          stale=0
          for script in hook-job-started.sh cleanup-slot.sh reregister.sh; do
            if [ "$EVENT" = push ]; then
              cat "scripts/ci-runner/$script"
            else
              git show "origin/main:scripts/ci-runner/$script"
            fi | cmp -s - "$dir/$script" || {
              echo "::error::$dir/$script does not match scripts/ci-runner/$script. Run sh scripts/ci-runner/install.sh on the Studio"
              stale=1
            }
          done
          exit "$stale"

      # The checks that ride on the hosted build job. The iPhone job runs on
      # every trusted event, so they still gate every PR and every push; the
      # iPad job would only run them twice.
      - name: Test runner modes
        if: matrix.device == 'iPhone'
        run: |
          zsh scripts/test-modes.test.sh
          sh scripts/test-retryable.test.sh
          sh scripts/test-failed-selectors.test.sh
          sh scripts/ci-runner/hook-job-started.test.sh
          zsh scripts/ci-runner/cleanup-slot.test.sh
          sh scripts/ci-runner/install.test.sh
          python3 scripts/localization.test.py

      - name: Build fitting validator
        if: matrix.device == 'iPhone'
        run: swift build -c release --package-path tools/FitValidation

      # The IWLS fixture is compiled into the unit-test bundle, so it is staged
      # before the build. xcodegen and node come from the machine.
      - name: Prepare project
        run: |
          node scripts/iwls-fixtures.mjs prepare
          xcodegen generate

      - name: Localization completeness
        if: matrix.device == 'iPhone'
        run: python3 scripts/localization.py

      # Built here rather than inside test.sh because the warm-up below needs
      # the app before the tests run. The checkout cleans build/ every job, so
      # the packages live outside it, one directory per slot: MapLibre's binary
      # is then fetched once per slot instead of every run, and two slots never
      # resolve into the same directory at once.
      - name: Build
        timeout-minutes: 15
        run: |
          # `bash -e` without pipefail: the pipe into tail would report tail's
          # status, and a failed build would go on to the tests.
          set -o pipefail
          xcodebuild build-for-testing -project Slackwater.xcodeproj -scheme Slackwater \
            -testPlan Slackwater -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$HOME/Library/Caches/slackwater-ci/studio-$SLACKWATER_CI_SLOT/SourcePackages" \
            | tail -40
          # The watch app compiles for the watch simulator as the app's
          # dependency and embeds in Debug. Its absence means it silently
          # stopped building, not that the app is fine.
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/Slackwater.app/Watch/SlackwaterWatch.app

      # The runner's .env puts SLACKWATER_CI_SLOT in the process environment,
      # not in the `env` expression context, so the device name is built in
      # the shell and handed on through GITHUB_ENV. Set this late: the runner
      # mode tests above run test.sh with and without SLACKWATER_SIMS.
      - name: Name the slot's device
        run: |
          echo "SLACKWATER_SIMS=SlackwaterCI-$SLACKWATER_CI_SLOT-$DEVICE" >> "$GITHUB_ENV"
          # Three slots share this Mac's /tmp, where test.sh's default would mix
          # their screenshots. RUNNER_TEMP is this runner's own and is emptied per job.
          echo "SHOT_DIR=$RUNNER_TEMP/slackwater-shots" >> "$GITHUB_ENV"
        env:
          DEVICE: ${{ matrix.device }}

      # The hosted app job's warm-up, adapted. The cleanup above erased the
      # slot's device, and test.sh runs the tests on xcodebuild clones of it.
      # The clones boot cold themselves, but they inherit the device's disk
      # state: the location prompt already handled (see the hosted comment)
      # and the first-launch caches already written. The device is shut down
      # at the end because test.sh has only ever cloned a shut-down device.
      # No runtime filter: the slot's devices are unique by name.
      - run: |
          udid=$(xcrun simctl list devices available | grep -F "$SLACKWATER_SIMS (" | tail -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$udid" ] || { echo "no simulator named '$SLACKWATER_SIMS'" >&2; exit 1; }
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/DerivedData/Build/Products/Debug-iphonesimulator/Slackwater.app
          xcrun simctl launch "$udid" io.openwaters.slackwater -noCloudSync -chartPacksOff -currentFillOff -uiTestQuiet -networkKillSwitch \
            -seedLocationAsk -seedTour
          sleep 45
          xcrun simctl terminate "$udid" io.openwaters.slackwater || true
          xcrun simctl uninstall "$udid" io.openwaters.slackwater
          xcrun simctl shutdown "$udid"

      # As the hosted app job, minus its hosted-runner settings: test.sh sizes
      # its own workers, clones the slot's device for them, and applies its
      # own PERF_SCALE default of 2, which it chose for overlapped runs on
      # this machine. SLACKWATER_SIMS comes from the step above.
      - id: tests
        continue-on-error: true
        run: |
          SLACKWATER_XCTESTRUN=$(echo build/DerivedData/Build/Products/*.xctestrun)
          export SLACKWATER_XCTESTRUN
          ./scripts/test.sh ${MODE:+"$MODE"} && exit 0
          grep -q 'Unable to find a device matching' build/results-*.log || exit 1
          echo "::warning::xcodebuild found no simulator; retrying once"
          ./scripts/test.sh ${MODE:+"$MODE"}
        env:
          MODE: ${{ github.event_name == 'push' && '--full' || '' }}

      # The hosted app job's failure messages, rerun and verdict; the comments
      # there say why each exists.
      - name: Failure messages
        id: failures
        if: steps.tests.outcome == 'failure'
        run: |
          { echo '```'; scripts/test-failures.sh build/*.xcresult; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(for b in build/*.xcresult; do
            xcrun xcresulttool get test-results tests --path "$b" 2>/dev/null \
              | jq -r -f scripts/test-failed-selectors.jq
          done | paste -sd, -)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if scripts/test-failures.sh build/*.xcresult | sh scripts/test-retryable.sh; then
            echo "retryable_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rerun tests that timed out
        id: rerun
        if: steps.tests.outcome == 'failure' && steps.failures.outputs.retryable_only == 'true'
        run: |
          for b in build/*.xcresult build/*.log build/*.summary.json; do
            [ -e "$b" ] || continue
            case "$b" in
              *.xcresult) mv "$b" "${b%.xcresult}-attempt1.xcresult" ;;
              *.log) mv "$b" "${b%.log}-attempt1.log" ;;
              *.summary.json) mv "$b" "${b%.summary.json}-attempt1.summary.json" ;;
            esac
          done
          SLACKWATER_XCTESTRUN=$(echo build/DerivedData/Build/Products/*.xctestrun) \
            ./scripts/test.sh ${{ github.event_name == 'push' && '--full' || '' }} \
            || { scripts/test-failures.sh build/*.xcresult | grep -v attempt1; exit 1; }
        env:
          SLACKWATER_ONLY: ${{ steps.failures.outputs.failed }}

      - name: Test result
        if: always()
        run: test "${{ steps.tests.outcome }}" = success || test "${{ steps.rerun.outcome }}" = success

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-summary-studio-${{ matrix.device }}
          path: build/*.summary.json
          if-no-files-found: ignore

      # always() and 'cancelled' for the reasons on the hosted app job's
      # upload: a timed-out run is the one with nothing to read elsewhere.
      - name: Upload screenshots and results
        if: always() && (steps.tests.outcome == 'failure' || steps.tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-studio-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/slackwater-shots
            build/*.xcresult
            build/results-*.log
          if-no-files-found: ignore

      - name: Clean the slot
        if: always()
        run: zsh scripts/ci-runner/cleanup-slot.sh "$SLACKWATER_CI_SLOT"

  required:
    name: Required checks
    if: always()
    needs: [changes, data, feedback, lockfile, route, build, app, studio]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DATA: ${{ needs.data.result }}
          FEEDBACK: ${{ needs.feedback.result }}
          LOCKFILE: ${{ needs.lockfile.result }}
          APP_NEEDED: ${{ needs.changes.outputs.app }}
          TRUSTED: ${{ needs.route.outputs.trusted }}
          STUDIO: ${{ needs.route.outputs.studio }}
          STUDIO_RESULT: ${{ needs.studio.result }}
          BUILD: ${{ needs.build.result }}
          APP: ${{ needs.app.result }}
        run: |
          test "$CHANGES" = success
          test "$DATA" = success
          test "$FEEDBACK" = success
          test "$LOCKFILE" = success
          if [ "$APP_NEEDED" = true ]; then
            # Whichever path ran must pass; the one route skipped is not read.
            echo "trusted: ${TRUSTED:-unknown}, studio: ${STUDIO:-unknown}"
            if [ "$STUDIO" = true ]; then
              test "$STUDIO_RESULT" = success
            else
              test "$BUILD" = success
              test "$APP" = success
            fi
          fi
