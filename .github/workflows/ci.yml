name: CI

# ADVISORY, not blocking. openwatersio is a free org and this repo is private,
# so GitHub offers neither branch protection nor rulesets here — nothing can
# reject a push to main server-side. CI reports; the policy it backs is in
# CONTRIBUTING.md and holds by agreement. If the org ever moves to Team, turn
# these jobs into required checks and the policy stops being voluntary.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the app lane below. The lane is ~15 minutes of macOS runner time, and
  # public-repo macOS pools can queue at peak — a docs-only change should not
  # book one. Measured: PRs whose entire diff was CLAUDE.md, or two markdown
  # files, each took a full run.
  #
  # This is a JOB-level gate, not `on: paths-ignore`, for two reasons: the free
  # Ubuntu lane below should still run, and a workflow that never starts leaves
  # a required check pending forever, whereas a job skipped by `if:` satisfies
  # it. (CI is advisory today — see the header — but this keeps the door open.)
  #
  # Fail-safe by construction: it skips only when EVERY changed path is docs or
  # a top-level .md. A new directory nobody thought about runs the suite.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # This repo's default_workflow_permissions is `read`, which is GitHub's
    # RESTRICTIVE default — contents and packages only, no pull-requests scope.
    # Without this grant `gh api .../pulls/N/files` 403s, the step's fail-safe
    # fires, and the gate runs the Studio lane for every docs PR: silently
    # inert, exactly as if it were not here. Job-scoped so the other two jobs
    # keep the restrictive default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # No checkout on purpose. `git diff` would need the history, and a full
      # clone of this repo is 149 MB of committed pmtiles — a minute of runner
      # time on every PR to answer a question the API answers in a second.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # GitHub runs `run:` blocks as `bash -e {0}`, so ANY unhandled non-zero
          # aborts the step mid-decision — including `grep -v` finding nothing,
          # which is precisely the docs-only case this job exists to detect. That
          # is not hypothetical: it turned the first correct skip into a red build
          # on main. Every failure below is handled explicitly and falls through
          # to running the suite, so -e can only convert a right answer into a
          # broken one.
          set +e
          set -uo pipefail
          # Falling through to "run" is the safe direction, but it must never be
          # a SILENT one: a permanently broken gate that always runs the Studio
          # lane looks exactly like a green, working gate. Warn, visibly, and
          # still succeed.
          run_it() {
            echo "::warning title=Docs-only gate could not decide::$1"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = "pull_request" ]; then
            # --paginate: up to 3000 files, far past anything real here.
            FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') \
              || run_it "could not list PR files — running the app lane"
          else
            case "$BEFORE" in
              ''|0000000000000000000000000000000000000000)
                run_it "no usable base ref — running the app lane" ;;
            esac
            FILES=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') \
              || run_it "could not compare $BEFORE...$SHA — running the app lane"
            # The compare endpoint truncates at 300 files. A diff that large is
            # not docs-only, but do not rely on guessing what got cut.
            [ "$(echo "$FILES" | wc -l)" -ge 300 ] && run_it "diff truncated at 300 files — running the app lane"
          fi

          [ -z "$FILES" ] && run_it "no files reported — running the app lane"
          echo "changed:"; echo "$FILES" | sed 's/^/  /'

          # `|| true`: grep -v exits 1 when everything is filtered out, i.e. the
          # docs-only case. Belt and braces alongside `set +e` above.
          OTHER=$(echo "$FILES" | grep -vE '^docs/|^[^/]*\.md$' || true)
          if [ -n "$OTHER" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "-> app lane RUNS (non-docs paths present)"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "-> app lane SKIPPED (every path is docs/ or a top-level .md)"
          fi

  data:
    name: Data generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      # gen-chs-stations.mjs is the only generator that needs the network (the
      # DFO IWLS API), so it stays out of CI and its artefact is trusted as
      # committed. The other two read local files only, which means CI can
      # regenerate them and prove the committed bundles still match — a
      # generator edited without a rerun fails here instead of shipping stale
      # data to the App Store.
      - name: Regenerate the offline bundles
        working-directory: tools
        run: node gen-tides.mjs && node gen-noaa-currents.mjs && node gen-slugs.mjs && node gen-station-index.mjs

      - name: Committed bundles match their generators
        run: git diff --exit-code Slackwater/Resources/stations.json Slackwater/Resources/currents.json Slackwater/Resources/slugs.json Slackwater/Resources/station-index.json

      - name: Bundle invariants
        working-directory: tools
        run: node --test

  app:
    name: App tests
    needs: changes
    # `&& false` disables the lane while the repo is private: GitHub-hosted
    # macOS bills at 10x there, and the fast lane is ~15 min of wall clock —
    # about 150 billable minutes per run. Once the repo is public, hosted
    # runners are free: delete that one line and the lane runs.
    if: >-
      needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: brew install xcodegen

      # MapLibre is a binary download, not a compile — the cache saves the
      # fetch, not a build. The generated xcodeproj and its Package.resolved
      # are not committed, so key on project.yml, where the package pins live.
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Runs xcodegen, then the fast suite on the image's stock iPhone
      # simulator. Two things stay out of this lane and ride
      # `scripts/test.sh --full`, run by hand before an upload: the live-IWLS
      # UI tests (they skip themselves unless SLACKWATER_FULL is set) and the
      # iPad leg. SLACKWATER_SIMS must name ONE device — it overrides the
      # script's fast/full device list outright.
      #
      # CoreSimulator comes up cold on a fresh runner, and `xcodebuild` does not
      # wake it: it reports an EMPTY device list — placeholder destinations
      # only — and exits 70 on "Unable to find a device matching iPhone 17".
      # Listing the devices first starts the service, and the run below then
      # finds them. actions/runner-images#13459 collects the same one-liner in
      # front of `-downloadPlatform`, which fails the same way for the same
      # reason.
      #
      # This reads like a version problem and is not one. Apple ships no iOS
      # 26.6 simulator runtime at all, so the image's Xcode 26.6 against its
      # 26.5 runtime is the ordinary pairing — the same one every developer
      # here runs locally. Pinning DEVELOPER_DIR to 26.5 also turns the lane
      # green, which is what makes this worth writing down: it works only
      # because switching Xcode re-enumerates the devices, so it treats the
      # symptom and leaves a version to maintain forever.
      - run: xcrun simctl list > /dev/null

      # SLACKWATER_WORKERS is a memory budget: a booted simulator clone costs
      # ~2.2 GB and hosted arm runners have ~7 GB RAM, so one worker. If the
      # image's default Xcode ever drifts from what the project needs, pin
      # DEVELOPER_DIR here.
      # SLACKWATER_PERF_SCALE widens two things calibrated on the Mac Studio:
      # the unit tests' wall-clock budgets, and every wait in the UI target
      # (ScreenshotTestCase's `uiWaitScale`). The first hosted run measured
      # 1.9–2.5× slower; 4× absorbs pool variance while a real 2×+ regression
      # on top of that still trips. Without it on the waits, three runs of
      # identical code failed three different UI tests — see #331.
      - run: ./scripts/test.sh
        env:
          SLACKWATER_SIMS: iPhone 17
          SLACKWATER_WORKERS: 1
          TEST_RUNNER_SLACKWATER_PERF_SCALE: "4"

      # There is no runner to ssh into, so the evidence has to travel.
      - name: Upload screenshots and results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            /tmp/slackwater-shots
            build/*.xcresult
          if-no-files-found: ignore
