name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: America/Vancouver
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Owner gate
    runs-on: ubuntu-latest
    steps:
      - name: Require an owner on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Nightly releases run only from main." >&2
            exit 1
          fi
          admin=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq '.user.permissions.admin')
          if [[ "$admin" != true ]]; then
            echo "$GITHUB_TRIGGERING_ACTOR is not a repository owner." >&2
            exit 1
          fi

  release:
    name: Release to Nightly
    needs: authorize
    # Server-evaluated before runner assignment, including single-job reruns.
    if: github.triggering_actor == 'clarkbw' || github.triggering_actor == 'bkeepers'
    runs-on: macos-latest
    # Signing secrets live in this environment, which only main can deploy to.
    environment: testflight
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: brew install xcodegen

      # Same MapLibre download cache as ci.yml, shared with its keys.
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # Wakes CoreSimulator on a fresh runner; see the same step in ci.yml.
      - run: xcrun simctl list > /dev/null

      - name: Configure the release commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release changed main to Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          # Hosted-runner test settings; see the App tests job in ci.yml.
          SLACKWATER_WORKERS: 1
          TEST_RUNNER_SLACKWATER_PERF_SCALE: "4"
        run: zsh scripts/nightly.sh
