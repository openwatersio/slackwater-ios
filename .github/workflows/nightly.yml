name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: America/Vancouver
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Owner gate and CI selection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Require an owner on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Nightly releases run only from main." >&2
            exit 1
          fi
          admin=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq '.user.permissions.admin')
          if [[ "$admin" != true ]]; then
            echo "$GITHUB_TRIGGERING_ACTOR is not a repository owner." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select the latest fully validated main commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(python3 scripts/nightly-validation.py --select "$GITHUB_SHA") || exit $(( $? == 3 ? 0 : 1 ))
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    name: Release to Nightly
    needs: authorize
    # Server-evaluated before runner assignment, including single-job reruns.
    if: needs.authorize.outputs.sha != '' && (github.triggering_actor == 'clarkbw' || github.triggering_actor == 'bkeepers')
    runs-on: macos-latest
    # Signing secrets live in this environment, which only main can deploy to.
    environment: testflight
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Preserve the release validator
        # The selected source can predate the release script's CI gate.
        run: cp scripts/nightly-validation.py "$RUNNER_TEMP/nightly-validation.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Archive the selected green commit, even when newer main CI is pending.
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml

      - run: brew install xcodegen

      # Same MapLibre download cache as ci.yml, shared with its keys.
      - uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Release the validated commit to Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          # xcodebuild -exportArchive writes its .xcdistributionlogs here.
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 "$RUNNER_TEMP/nightly-validation.py" "$(git rev-parse HEAD)" || exit $(( $? == 3 ? 0 : 1 ))
          zsh scripts/nightly.sh

      # Archive and export failures print a summary to the job log; the
      # detail is in these files.
      - name: Upload release logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-logs
          path: |
            ${{ runner.temp }}/*.xcdistributionlogs
            build/Slackwater.xcarchive/Info.plist
            build/exportUpload.plist
          if-no-files-found: ignore
