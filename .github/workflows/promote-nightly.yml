name: Promote Nightly to Beta

on:
  workflow_dispatch:
    inputs:
      build:
        description: Nightly build number
        required: true
        type: string

concurrency:
  group: beta-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote existing Nightly build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: testflight
    permissions:
      contents: read
    steps:
      - name: Require an owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          admin=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq '.user.permissions.admin')
          [[ "$admin" == true ]] || { echo "$GITHUB_TRIGGERING_ACTOR is not a repository owner." >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Update notes and promote to Beta
        env:
          BUILD: ${{ inputs.build }}
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          zsh scripts/promote-nightly.sh "$BUILD"
