name: Release closed PR runners

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cancel:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Privileged cleanup executes only trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 scripts/cancel-closed-ci.py
        env:
          GH_TOKEN: ${{ github.token }}
