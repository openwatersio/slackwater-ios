name: Slackwater
options:
  bundleIdPrefix: org.openwaters
  deploymentTarget:
    iOS: "17.0"
packages:
  TideEngine:
    url: https://github.com/sailingnaturali/slackwater-engine
    from: 0.2.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.9.0
targets:
  Slackwater:
    type: application
    platform: iOS
    sources: [Slackwater]
    dependencies:
      - package: TideEngine
        product: TideEngine
      - package: MapLibre
        product: MapLibre
    info:
      path: Slackwater/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          Your location is used on this device to find the nearest tide and
          current stations. It never leaves the device.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaters.slackwater
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R3H8DPTV9C
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Release archives sign manually with the CI-keychain distribution identity
        # (headless: login keychain is locked to non-GUI sessions — see docs/testflight.md)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Slackwater App Store"
  SlackwaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlackwaterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
  SlackwaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlackwaterUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
schemes:
  Slackwater:
    build:
      targets:
        Slackwater: all
        SlackwaterTests: [test]
        SlackwaterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SlackwaterTests, SlackwaterUITests]
