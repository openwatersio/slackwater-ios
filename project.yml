name: Slackwater
options:
  bundleIdPrefix: org.openwaters
  # iOS 26: Liquid Glass chrome (MapHeader) with no #available fences. Raised
  # from the scaffolded 17 pre-App-Store (build 18, TestFlight only) while the
  # floor was still free to set. Retired nav-station iPads are a chartplotter
  # concern, not this app's.
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    # Shared by both targets so the appex's Info.plist $(MARKETING_VERSION)/
    # $(CURRENT_PROJECT_VERSION) substitutions resolve to the same values the
    # app ships — a per-target pair here silently drifts the two Info.plists
    # apart (the appex shipped 1.0/1 otherwise; see the app target's own
    # CFBundleVersion/CFBundleShortVersionString comment below for the history).
    MARKETING_VERSION: 1.3.0
    CURRENT_PROJECT_VERSION: 27
packages:
  TideEngine:
    url: https://github.com/sailingnaturali/slackwater-engine
    from: 0.4.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.9.0
targets:
  Slackwater:
    type: application
    platform: iOS
    sources: [Slackwater]
    dependencies:
      - package: TideEngine
        product: TideEngine
      - package: MapLibre
        product: MapLibre
      - target: SlackwaterWidgets
        embed: true
    info:
      path: Slackwater/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Without this the plist ships XcodeGen's literal default of "1" and the
        # build number that reaches TestFlight is whatever `exportArchive`
        # assigns (see scripts/testflight.sh) — a plain upload counter, not this
        # file. CURRENT_PROJECT_VERSION below was a hand-kept guess at that
        # counter for builds 1–21; now it IS the build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same omission, other half: builds 1–21 all shipped XcodeGen's literal
        # "1.0", so every TestFlight build so far reads 1.0 to testers and
        # 0.3.0/0.5.0/0.6.0 exist only in git. `manageAppVersionAndBuildNumber`
        # only ever managed the build number, never this. Builds 22 and 23 then
        # took TestFlight BACKWARDS, 1.0 → 0.6.0 → 0.7.0. App Store Connect
        # accepted the lower pre-release train — VALID, in both groups — and no
        # tester could install either one: the TestFlight app offers the highest
        # version train it has, which stayed 1.0 (21), and the sub-1.0 trains are
        # not even listed under Previous Builds. So VALID is not "shipped", and
        # this line must stay above 1.0 until the accidental train is retired.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSLocationWhenInUseUsageDescription: >-
          Your location is used on this device to find the nearest tide and
          current stations. It never leaves the device.
        # iPhone: portrait-only, as ever. iPad: all four + no UIRequiresFullScreen
        # so Split View / Slide Over work (App Store validation 90474 requires
        # exactly this set when multitasking is supported).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The app's first URL scheme: `slackwater://premium` opens the Widgets
        # gallery, `slackwater://station/<id>` opens that station's detail.
        # Widgets already emit both (Task 5/6); StationListView.onOpenURL
        # (SlackwaterApp.swift) is the receiving end.
        CFBundleURLTypes:
          - CFBundleURLName: org.openwaters.slackwater
            CFBundleURLSchemes: [slackwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaters.slackwater
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Slackwater/Slackwater.entitlements
        DEVELOPMENT_TEAM: R3H8DPTV9C
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Release archives sign manually with the CI-keychain distribution identity
        # (headless: login keychain is locked to non-GUI sessions — see docs/testflight.md)
        Release:
          CODE_SIGN_STYLE: Manual
          # Pinned by SHA-1: two same-named "Apple Distribution" identities
          # exist locally; the profile embeds only this one (docs/testflight.md)
          CODE_SIGN_IDENTITY: "02FBDB9A5D2DB409A4331349069A8C8B09D73069"
          PROVISIONING_PROFILE_SPECIFIER: "Slackwater App Store"
  SlackwaterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SlackwaterWidgets
      # Explicit station catalogs only — NOT the whole Resources folder. That
      # folder also holds ~98 MB of map tiles (pmtiles) and chart sprites that
      # nothing in this appex reads; bundling it inflated every widget build.
      # Keep this list in sync with the `bundled("...")` calls in the model
      # files below (grep bundled\( to verify).
      - path: Slackwater/Resources/stations.json
      - path: Slackwater/Resources/currents.json
      - path: Slackwater/Resources/chs-stations.json
      - path: Slackwater/Resources/chs-gates.json
      - path: Slackwater/Resources/chs-current-gates.json
      - path: Slackwater/Resources/chs-tombstones.json
      - Slackwater/AppGroup.swift
      - Slackwater/Units.swift
      - Slackwater/DeepLink.swift
      - Slackwater/SlackWindow.swift
      - Slackwater/WidgetStationLoader.swift
      - Slackwater/WidgetSnapshot.swift
      - Slackwater/TideStation.swift
      - Slackwater/CurrentStation.swift
      - Slackwater/ChsStation.swift
      - Slackwater/ChsGate.swift
      - Slackwater/ChsCurrentGate.swift
    dependencies:
      - package: TideEngine
        product: TideEngine
    info:
      path: SlackwaterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Slackwater
        # Without these the appex ships XcodeGen's literal "1.0"/"1" instead
        # of the app's real version — the appex-version blocker (see the
        # top-level `settings.base` these substitute from).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaters.slackwater.widgets
        CODE_SIGN_ENTITLEMENTS: SlackwaterWidgets/SlackwaterWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R3H8DPTV9C
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  SlackwaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlackwaterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
  SlackwaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlackwaterUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
schemes:
  Slackwater:
    build:
      targets:
        Slackwater: all
        SlackwaterTests: [test]
        SlackwaterUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Slackwater.storekit
    test:
      config: Debug
      targets: [SlackwaterTests, SlackwaterUITests]
      # One plan (TestPlans/). The UI tests that fetch live IWLS and fit
      # on-device — minutes each — skip themselves unless SLACKWATER_FULL
      # reaches the runner (ScreenshotTests.skipUnlessFull). Drive with
      # scripts/test.sh; `--full` sets TEST_RUNNER_SLACKWATER_FULL=1.
      testPlans:
        - path: TestPlans/Slackwater.xctestplan
          defaultPlan: true
