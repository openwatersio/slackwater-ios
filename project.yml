name: Slackwater
options:
  bundleIdPrefix: org.openwaters
  deploymentTarget:
    iOS: "17.0"
packages:
  TideEngine:
    url: https://github.com/sailingnaturali/slackwater-engine
    from: 0.2.0
targets:
  Slackwater:
    type: application
    platform: iOS
    sources: [Slackwater]
    dependencies:
      - package: TideEngine
        product: TideEngine
    info:
      path: Slackwater/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaters.slackwater
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
  SlackwaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlackwaterUITests]
    dependencies:
      - target: Slackwater
schemes:
  Slackwater:
    build:
      targets:
        Slackwater: all
        SlackwaterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SlackwaterUITests]
