name: Slackwater
options:
  bundleIdPrefix: io.openwaters
  developmentLanguage: en
  knownRegions: [Base, en, fr-CA]
  # iOS 26: Liquid Glass chrome with no #available fences. Raised
  # from the scaffolded 17 pre-App-Store (build 18, TestFlight only) while the
  # floor was still free to set. Retired nav-station iPads are a chartplotter
  # concern, not this app's.
  deploymentTarget:
    iOS: "26.0"
    # Matches the iOS floor under the same no-#available-fences rule, and
    # covers every watch back to Series 6 (#482).
    watchOS: "26.0"
settings:
  base:
    # Shared by both targets so the appex's Info.plist $(MARKETING_VERSION)/
    # $(CURRENT_PROJECT_VERSION) substitutions resolve to the same values the
    # app ships — a per-target pair here silently drifts the two Info.plists
    # apart (the appex shipped 1.0/1 otherwise; see the app target's own
    # CFBundleVersion/CFBundleShortVersionString comment below for the history).
    MARKETING_VERSION: 1.14.0
    CURRENT_PROJECT_VERSION: 42
    # The language mode the app compiles in, stated rather than inherited.
    # XcodeGen's default is 5.0 and the project it writes is gitignored, so
    # without this line the mode lives in no committed file: a version bump
    # could move it, and every concurrency warning in the app — the
    # non-Sendable UserDefaults in StationIntent, the detached run loop in
    # ChsFitService — would become an error at once, with nothing in git to
    # say what changed. Pinned at the value already in use, so this changes
    # no behaviour. Moving to 6 is a migration, not a setting.
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # Premium (the lock-screen widgets, its sheet, and slackwater://premium) is
    # Debug-only until it ships (#463). Add PREMIUM_ENABLED to Release to ship
    # it. DEBUG is restated because this key replaces XcodeGen's preset.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PREMIUM_ENABLED"
packages:
  Almanac:
    url: https://github.com/openwatersio/almanac
    from: 0.4.2
  slackwater:
    # Exact-commit pin: the stack is in prerelease (slackwater#338 stage 4),
    # so the repo has no post-rename semver tag yet. Becomes a `from:` version
    # at the deliberate 1.0.0 release. Native CHS fitting requires #341.
    url: https://github.com/openwatersio/slackwater
    revision: 6021524a3f2c5f609cd41af645ebea4a0e135bf8
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.9.0
targetTemplates:
  # The app sources that build for every platform: no UIKit, no app lifecycle.
  # The widget extension and the watch app both compile this one list, so a
  # file added here reaches both. XcodeGen appends a target's own `sources`
  # and `dependencies` to these.
  PortableSources:
    sources:
      - Slackwater/Localizable.xcstrings
      # Explicit station catalogs only — NOT the whole Resources folder. That
      # folder also holds resources (fill bundles, glyphs) that neither the
      # widget nor the watch reads; bundling it all inflated every widget build.
      # Keep this list in sync with the `bundled("...")` calls in the model
      # files below (grep bundled\( to verify).
      - path: Slackwater/Resources/stations.json
      - path: Slackwater/Resources/currents.json
      - path: Slackwater/Resources/chs-stations.json
      - path: Slackwater/Resources/chs-gates.json
      - path: Slackwater/Resources/chs-current-gates.json
      - path: Slackwater/Resources/chs-tombstones.json
      # 20 KB, and no widget reads it today. It is here because ChsStation.swift
      # (compiled from this list below) declares `bundled("unavailable-stations")`,
      # and `bundled` is a preconditionFailure on a missing file — the first
      # code to touch `UnavailableStation.all` would crash the target, not
      # degrade. The list's sync rule above is what prevents that.
      - path: Slackwater/Resources/unavailable-stations.json
      - Slackwater/AppGroup.swift
      - Slackwater/Units.swift
      - Slackwater/Palette.swift
      - Slackwater/DeepLink.swift
      - Slackwater/SlackWindow.swift
      - Slackwater/CardStatus.swift
      - Slackwater/StationCardFace.swift
      - Slackwater/StationCardGraph.swift
      - Slackwater/CurveDrawing.swift
      - Slackwater/TideMovement.swift
      - Slackwater/CatalogSnapshot.swift
      - Slackwater/CatalogStorage.swift
      - Slackwater/WidgetStationLoader.swift
      - Slackwater/StationIntent.swift
      - Slackwater/WidgetSnapshot.swift
      - Slackwater/DayCurveContentView.swift
      - Slackwater/NextEventContentView.swift
      - Slackwater/TideStation.swift
      - Slackwater/CurrentStation.swift
      # The types only; station-index.json stays out of the widget on purpose.
      # The widget resolves one station by id through `decodeCatalogRecord`
      # and never builds `StationItem.all`, so it never loads the index. The
      # watch adds the index in its own target below.
      - Slackwater/StationIndex.swift
      - Slackwater/ChsStation.swift
      - Slackwater/ChsGate.swift
      - Slackwater/ChsCurrentGate.swift
    dependencies:
      - package: slackwater
        product: SlackwaterKit
targets:
  Slackwater:
    type: application
    platform: iOS
    sources: [Slackwater]
    dependencies:
      - package: Almanac
        product: Almanac
      - package: slackwater
        product: SlackwaterKit
      - package: MapLibre
        product: MapLibre
      - target: SlackwaterWidgets
        embed: true
      # Embedded in Debug only; see EXCLUDED_SOURCE_FILE_NAMES under Release.
      - target: SlackwaterWatch
    info:
      path: Slackwater/Info.plist
      properties:
        # LaunchBackground is SN.canvas (Palette.swift) as an asset — the
        # launch screen renders before any code runs, so the hex lives twice.
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        # SwiftUI's `.preferredColorScheme(.dark)` (RootView, SlackwaterApp.swift)
        # only reaches the app's own view hierarchy. This plist key sets the
        # app's trait collection at the OS level, so in-process system UI the
        # app presents (share sheet, keyboard, action sheets) follows it
        # without needing a SwiftUI modifier on every sheet. CLLocationManager's
        # authorization alert is a separate case: it always renders using the
        # device's own appearance, checked on the simulator with this key set,
        # and no app-level setting reaches it.
        UIUserInterfaceStyle: Dark
        # Without this the plist ships XcodeGen's literal default of "1" and the
        # build number that reaches TestFlight is whatever `exportArchive`
        # assigns (see scripts/testflight.sh) — a plain upload counter, not this
        # file. CURRENT_PROJECT_VERSION below was a hand-kept guess at that
        # counter for builds 1–21; now it IS the build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same omission, other half: builds 1–21 all shipped XcodeGen's literal
        # "1.0", so every TestFlight build so far reads 1.0 to testers and
        # 0.3.0/0.5.0/0.6.0 exist only in git. `manageAppVersionAndBuildNumber`
        # only ever managed the build number, never this. Builds 22 and 23 then
        # took TestFlight BACKWARDS, 1.0 → 0.6.0 → 0.7.0. App Store Connect
        # accepted the lower pre-release train — VALID, in both groups — and no
        # tester could install either one: the TestFlight app offers the highest
        # version train it has, which stayed 1.0 (21), and the sub-1.0 trains are
        # not even listed under Previous Builds. So VALID is not "shipped", and
        # this line must stay above 1.0 until the accidental train is retired.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSLocationWhenInUseUsageDescription: >-
          Your location helps find nearby tide and current predictions.
          It stays on this device.
        # iPhone: portrait-only, as ever. iPad: all four + no UIRequiresFullScreen
        # so Split View / Slide Over work (App Store validation 90474 requires
        # exactly this set when multitasking is supported).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The app's first URL scheme: `slackwater://premium` opens the Widgets
        # gallery, `slackwater://station/<id>` opens that station's detail.
        # Widgets already emit both (Task 5/6); StationListView.onOpenURL
        # (SlackwaterApp.swift) is the receiving end.
        CFBundleURLTypes:
          - CFBundleURLName: io.openwaters.slackwater
            CFBundleURLSchemes: [slackwater]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.openwaters.slackwater
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Slackwater/Slackwater.entitlements
        DEVELOPMENT_TEAM: Z59BQLF5VQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Release archives sign manually with the distribution identity that
        # scripts/testflight.sh imports into a throwaway keychain (headless: the
        # login keychain is locked to non-GUI sessions — see docs/testflight.md)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Slackwater App Store"
          # Keeps the watch app out of the archive until it has its own bundle
          # IDs and App Store profiles (#482, Phase 3). Xcode applies this
          # setting to the Embed Watch Content copy as well as to sources, and
          # skipping the copy also skips its embedded-binary validation. Delete
          # it, and SlackwaterWatch's Release block, in the provisioning PR.
          EXCLUDED_SOURCE_FILE_NAMES: SlackwaterWatch.app
  SlackwaterWidgets:
    type: app-extension
    platform: iOS
    templates: [PortableSources]
    sources: [SlackwaterWidgets]
    info:
      path: SlackwaterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Slackwater
        # Without these the appex ships XcodeGen's literal "1.0"/"1" instead
        # of the app's real version — the appex-version blocker (see the
        # top-level `settings.base` these substitute from).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.openwaters.slackwater.widgets
        CODE_SIGN_ENTITLEMENTS: SlackwaterWidgets/SlackwaterWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z59BQLF5VQ
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        # The appex needs its OWN distribution profile — an app's profile does
        # not cover its extensions. Without this block the target stayed on
        # Automatic and Release fell back to "iOS Team Provisioning Profile: *",
        # which a headless session cannot mint: build 28's first archive died on
        # six App-Groups entitlement errors after a fully green suite, because
        # distribution signing is only ever exercised by testflight.sh, i.e.
        # after the merge gate. See docs/testflight.md.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Slackwater Widgets App Store"
  SlackwaterWatch:
    type: application
    platform: watchOS
    templates: [PortableSources]
    sources:
      - SlackwaterWatch
      # The full catalog ships on the watch (#482). The index is the one file
      # the widget leaves out: the watch browses, so it builds `StationItem.all`.
      - path: Slackwater/Resources/station-index.json
    dependencies:
      - package: Almanac
        product: Almanac
    info:
      path: SlackwaterWatch/Info.plist
      properties:
        CFBundleDisplayName: Slackwater
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.openwaters.slackwater
        # Standalone-capable: catalogs are bundled, favorites arrive over
        # iCloud KVS, and nothing needs the phone (#482).
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        # Permanent once registered (#207): the companion's id plus .watchkitapp.
        PRODUCT_BUNDLE_IDENTIFIER: io.openwaters.slackwater.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z59BQLF5VQ
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # A Release archive still builds this target, because the app depends
        # on it, but does not embed it (the app's EXCLUDED_SOURCE_FILE_NAMES).
        # There is no distribution profile to sign it with yet, so it builds
        # unsigned; XcodeGen's watchOS preset already sets SKIP_INSTALL, which
        # keeps it out of the archive's products.
        Release:
          CODE_SIGNING_ALLOWED: NO
  SlackwaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlackwaterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
  SlackwaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SlackwaterUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Slackwater
schemes:
  Slackwater:
    build:
      targets:
        Slackwater: all
        SlackwaterTests: [test]
        SlackwaterUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Slackwater.storekit
    test:
      config: Debug
      targets: [SlackwaterTests, SlackwaterUITests]
      # One plan (TestPlans/). scripts/test.sh selects its offline fast/full,
      # unit-only, or explicitly live UI subset without duplicating the plan.
      testPlans:
        - path: TestPlans/Slackwater.xctestplan
          defaultPlan: true
  # First-run state on every launch, for iterating on the gate. Location stays
  # real, so the permission prompt needs a device erased by scripts/first-run.sh.
  Slackwater First Run:
    build:
      targets:
        Slackwater: all
    run:
      config: Debug
      storeKitConfiguration: Slackwater.storekit
      commandLineArguments:
        "-resetGate": true
        "-resetRecents": true
        "-resetFavorites": true   # also keeps the run off iCloud (FavoritesCloud.store)
        "-chsResetModels": true
