name: Slackwater
options:
  bundleIdPrefix: org.openwaters
  deploymentTarget:
    iOS: "17.0"
packages:
  TideEngine:
    url: https://github.com/sailingnaturali/slackwater-engine
    from: 0.2.0
targets:
  Slackwater:
    type: application
    platform: iOS
    sources: [Slackwater]
    dependencies:
      - package: TideEngine
        product: TideEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaters.slackwater
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
